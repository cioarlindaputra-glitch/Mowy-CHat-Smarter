<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mowy — CS AI Interior</title>
<style>
  :root {
    --bg: #0f1117; --panel: #171a23; --panel2: #1e2230; --border: #2a2f3e;
    --text: #e6e8ee; --muted: #8b90a0; --brand: #ff6b2c; --brand-d: #e85a1c;
    --me: #2563eb; --ok: #22c55e; --warn: #f59e0b; --cold: #3b82f6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 12px 18px;
    background: var(--panel); border-bottom: 1px solid var(--border);
  }
  .logo { width: 34px; height: 34px; border-radius: 9px; background: var(--brand);
    display: grid; place-items: center; font-weight: 800; color: #fff; }
  header h1 { font-size: 16px; margin: 0; } header .sub { font-size: 12px; color: var(--muted); }
  .wrap { flex: 1; display: grid; grid-template-columns: 1fr 380px; min-height: 0; }
  @media (max-width: 860px) { .wrap { grid-template-columns: 1fr; } .score { display: none; } }

  .chat { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--border); }
  .msgs { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  .bubble { max-width: 78%; padding: 10px 13px; border-radius: 14px; line-height: 1.45; font-size: 14px; white-space: pre-wrap; }
  .bot { background: var(--panel2); border: 1px solid var(--border); align-self: flex-start; border-bottom-left-radius: 4px; }
  .me { background: var(--me); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  .meta { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .composer { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border); background: var(--panel); }
  .composer input { flex: 1; background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    padding: 11px 13px; border-radius: 10px; font-size: 14px; outline: none; }
  .composer input:focus { border-color: var(--brand); }
  .composer button { background: var(--brand); color: #fff; border: 0; padding: 0 20px; border-radius: 10px;
    font-weight: 700; cursor: pointer; }
  .composer button:hover { background: var(--brand-d); } .composer button:disabled { opacity: .5; cursor: default; }

  .score { background: var(--panel); overflow-y: auto; padding: 16px; }
  .gauge { text-align: center; padding: 10px 0 16px; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
  .gauge .num { font-size: 42px; font-weight: 800; line-height: 1; }
  .gauge .max { color: var(--muted); font-size: 14px; }
  .tag { display: inline-block; margin-top: 8px; padding: 3px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; }
  .tag.Hot { background: rgba(239,68,68,.15); color: #f87171; }
  .tag.Warm { background: rgba(245,158,11,.15); color: var(--warn); }
  .tag.Cold { background: rgba(59,130,246,.15); color: var(--cold); }
  .kpi { display: flex; align-items: flex-start; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); }
  .dot { width: 16px; height: 16px; border-radius: 5px; margin-top: 2px; flex: none; border: 1px solid var(--border); }
  .dot.on { background: var(--ok); border-color: var(--ok); }
  .kpi .l { flex: 1; font-size: 13px; }
  .kpi .l small { color: var(--muted); display: block; font-size: 11px; margin-top: 2px; }
  .kpi .w { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .kpi .w b { color: var(--text); }
  .hint { font-size: 11px; color: var(--muted); padding: 10px 2px 2px; }
</style>
</head>
<body>
  <header>
    <div class="logo">M</div>
    <div>
      <h1>Mowy</h1>
      <div class="sub">Customer Service AI · Interior</div>
    </div>
  </header>

  <div class="wrap">
    <section class="chat">
      <div class="msgs" id="msgs"></div>
      <form class="composer" id="form">
        <input id="input" autocomplete="off" placeholder="Tulis pesan sebagai customer…" />
        <button id="send" type="submit">Kirim</button>
      </form>
    </section>

    <aside class="score">
      <div class="gauge">
        <div><span class="num" id="total">0</span><span class="max" id="max">/100</span></div>
        <span class="tag Cold" id="temp">Cold</span>
      </div>
      <div id="kpis"></div>
      <div class="hint">Skor dihitung otomatis oleh AI dari isi percakapan. Kriteria terpenuhi → kotak hijau.</div>
    </aside>
  </div>

<script>
  let leadId = null;
  const msgsEl = document.getElementById('msgs');
  const kpisEl = document.getElementById('kpis');
  let CRITERIA = [];

  function addBubble(text, who) {
    const b = document.createElement('div');
    b.className = 'bubble ' + (who === 'me' ? 'me' : 'bot');
    b.textContent = text;
    msgsEl.appendChild(b);
    msgsEl.scrollTop = msgsEl.scrollHeight;
    return b;
  }

  async function loadCriteria() {
    CRITERIA = await (await fetch('/api/criteria')).json();
    renderScore(null);
  }

  function renderScore(score) {
    const byKey = {};
    (score?.breakdown || []).forEach(b => byKey[b.key] = b);
    document.getElementById('total').textContent = score ? score.total : 0;
    document.getElementById('max').textContent = '/' + (score ? score.max : 100);
    const tempEl = document.getElementById('temp');
    const t = score ? score.temperature : 'Cold';
    tempEl.textContent = t; tempEl.className = 'tag ' + t;

    kpisEl.innerHTML = '';
    CRITERIA.forEach(c => {
      const b = byKey[c.key] || { met: false, earned: 0, value: '' };
      const row = document.createElement('div');
      row.className = 'kpi';
      row.innerHTML = `
        <div class="dot ${b.met ? 'on' : ''}"></div>
        <div class="l">${c.no}. ${c.label}${b.value ? `<small>${escapeHtml(b.value)}</small>` : ''}</div>
        <div class="w"><b>${b.met ? (b.earned ?? c.weight) : 0}</b>/${c.weight}%</div>`;
      kpisEl.appendChild(row);
    });
  }

  function escapeHtml(s) { return String(s).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const input = document.getElementById('input');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    addBubble(text, 'me');
    const sendBtn = document.getElementById('send');
    sendBtn.disabled = true;
    const typing = addBubble('Mowy sedang mengetik…', 'bot');
    try {
      const res = await fetch('/api/chat', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ leadId, message: text }),
      });
      const data = await res.json();
      typing.remove();
      if (data.error) { addBubble('⚠️ ' + data.error, 'bot'); return; }
      leadId = data.leadId;
      addBubble(data.reply, 'bot');
      if (data.score) renderScore(data.score);
    } catch (err) {
      typing.remove();
      addBubble('⚠️ Gagal terhubung ke server.', 'bot');
    } finally {
      sendBtn.disabled = false; input.focus();
    }
  });

  loadCriteria();
  addBubble('Halo! Saya Mowy 👋 Ada yang bisa saya bantu untuk rencana interior Anda?', 'bot');
</script>
</body>
</html>
